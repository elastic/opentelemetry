name: Docs Agentic Workflow — Issue Comment

# Distributed to repositories in config/docs/active-repositories.json.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read

jobs:
  # edited: AI menus. created: dashboard deactivation-reason only (avoid every
  # consumer comment paying for a reusable + prelude run).
  run-docs-aw-issue-comment:
    if: >-
      github.event.action == 'edited' ||
      (github.event.action == 'created' &&
       github.event.issue.pull_request == null &&
       contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/dashboard'))
    permissions:
      actions: read
      checks: read
      contents: read
      copilot-requests: write
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/docs-aw-event-issue-comment.yml@main # ratchet:exclude
