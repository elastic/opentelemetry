name: Docs Agentic Workflow — AI PR Menu

# Distributed to repositories in config/docs/active-repositories.json.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- trusted split-workflow handoff; constrained by base-ref check below
    workflows: ["Docs Agentic Workflow — AI PR Menu (collect)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number for Docs PR AI menu (manual refresh).
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  run-docs-aw-workflow-run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.workflow_run.pull_requests.*.base.ref, 'main')
    permissions:
      actions: read
      checks: read
      contents: read
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/docs-aw-event-workflow-run.yml@main # ratchet:exclude
