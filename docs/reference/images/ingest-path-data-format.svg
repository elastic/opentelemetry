<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">How the ingest path determines the data format</title>
  <desc id="desc">Any OTLP source can send data to the Managed OTLP Endpoint, Elastic Agent in OTel mode, or the Elasticsearch OTLP/HTTP endpoint, which store OTel-native documents, or to APM Server and the managed intake service, which store ECS documents.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-legacy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>
  <style>
    .box { fill: #f2f4f7; stroke: #d0d5dd; stroke-width: 1.25; }
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1d2939; }
    .edge { fill: none; stroke: #667085; stroke-width: 1.5; marker-end: url(#arrow); }
    .edge-legacy { fill: none; stroke: #98a2b3; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow-legacy); }
    .chip { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475467; }
    .chip-bg { fill: #ffffff; }
  </style>

  <!-- Source -->
  <rect class="box" x="16" y="148" width="168" height="52" rx="10"/>
  <text class="label" x="100" y="179" text-anchor="middle">Any OTLP source</text>

  <!-- Destinations -->
  <rect class="box" x="300" y="16" width="240" height="52" rx="10"/>
  <text class="label" x="420" y="47" text-anchor="middle">Managed OTLP Endpoint</text>

  <rect class="box" x="300" y="88" width="240" height="52" rx="10"/>
  <text class="label" x="420" y="119" text-anchor="middle">Elastic Agent in OTel mode</text>

  <rect class="box" x="300" y="160" width="240" height="52" rx="10"/>
  <text class="label" x="420" y="191" text-anchor="middle">Elasticsearch OTLP/HTTP</text>

  <rect class="box" x="300" y="276" width="240" height="52" rx="10"/>
  <text class="label" x="420" y="307" text-anchor="middle">APM Server / managed intake</text>

  <!-- Formats -->
  <rect class="box" x="680" y="88" width="220" height="52" rx="10"/>
  <text class="label" x="790" y="119" text-anchor="middle">OTel-native documents</text>

  <rect class="box" x="680" y="276" width="220" height="52" rx="10"/>
  <text class="label" x="790" y="307" text-anchor="middle">ECS documents</text>

  <!-- Source to destinations. Vertical bus stays at x=220; labels sit on the
       horizontal stubs so they are not crossed by the spine. -->
  <path class="edge" d="M184 174 H220 V42 H292"/>
  <rect class="chip-bg" x="232" y="26" width="36" height="14" rx="2"/>
  <text class="chip" x="250" y="37" text-anchor="middle">OTLP</text>

  <path class="edge" d="M184 174 H220 V114 H292"/>
  <rect class="chip-bg" x="232" y="98" width="36" height="14" rx="2"/>
  <text class="chip" x="250" y="109" text-anchor="middle">OTLP</text>

  <path class="edge" d="M184 174 H292"/>
  <rect class="chip-bg" x="226" y="158" width="56" height="14" rx="2"/>
  <text class="chip" x="254" y="169" text-anchor="middle">OTLP/HTTP</text>

  <path class="edge-legacy" d="M184 174 H220 V302 H292"/>
  <rect class="chip-bg" x="226" y="286" width="64" height="14" rx="2"/>
  <text class="chip" x="258" y="297" text-anchor="middle">legacy OTLP</text>

  <!-- Destinations to formats -->
  <path class="edge" d="M540 42 H610 V114 H672"/>
  <path class="edge" d="M540 114 H672"/>
  <path class="edge" d="M540 186 H610 V114 H672"/>
  <path class="edge-legacy" d="M540 302 H672"/>
</svg>
